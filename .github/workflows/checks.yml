name: Verificar practica 2

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  software:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Pruebas Python, contrato C++ y recorrido TCP
        run: python -m tools.verify --software-only

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        device: [sensor, actuator]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - name: Compilar ESP32
        run: python -m platformio run -d firmware -e ${{ matrix.device }}
