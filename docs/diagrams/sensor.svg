<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460">
  <rect width="800" height="460" fill="#fff"/>
  <g font-family="Arial, sans-serif" font-size="15" fill="#172d43">
    <text x="40" y="35" font-size="22" font-weight="bold">Objeto sensor — ESP32 + HC-SR04</text>
    <rect x="40" y="80" width="240" height="270" rx="10" fill="#eef4f9" stroke="#44627f" stroke-width="2"/>
    <text x="65" y="112" font-size="19" font-weight="bold">ESP32 sensor</text>
    <text x="60" y="146">Alimentación USB</text>
    <text x="175" y="174">GPIO 5</text>
    <text x="170" y="254">GPIO 18</text>
    <text x="60" y="332">GND</text>
    <rect x="540" y="80" width="210" height="270" rx="10" fill="#eef4f9" stroke="#44627f" stroke-width="2"/>
    <text x="570" y="112" font-size="19" font-weight="bold">HC-SR04</text>
    <text x="555" y="143">VCC (5 V)</text>
    <text x="555" y="174">TRIG</text>
    <text x="555" y="254">ECHO</text>
    <text x="610" y="332">GND</text>
    <text x="455" y="65">Fuente 5 V</text>
    <text x="452" y="225">R1: 1 kΩ</text>
    <text x="415" y="310">R2: 2 kΩ</text>
    <text x="309" y="236">≈ 3,33 V</text>
    <text x="40" y="430">ECHO → R1 → GPIO 18; GPIO 18 → R2 → GND. Tierra común en este montaje.</text>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M500 70 V140 H540" stroke="#bf3744"/>
    <path d="M280 170 H540" stroke="#277869"/>
    <path d="M540 250 H500 L492 240 L482 260 L472 240 L462 260 L452 240 L442 260 L434 250 H280" stroke="#2c6faa"/>
    <path d="M400 250 V276 L390 284 L410 294 L390 304 L410 314 L390 324 L410 334 L400 342 V390" stroke="#2c6faa"/>
    <path d="M90 350 V390 H650 V350" stroke="#52616c"/>
    <path d="M388 401 H412 M392 407 H408 M396 413 H404" stroke="#52616c"/>
    <path d="M400 390 V401" stroke="#52616c"/>
  </g>
  <circle cx="400" cy="250" r="4" fill="#2c6faa"/>
  <circle cx="400" cy="390" r="4" fill="#52616c"/>
</svg>
